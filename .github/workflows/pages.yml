name: Publish ATLANTES atlas
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Locate the static site
        id: site
        shell: bash
        run: |
          if [ -f GithubPages/index.html ]; then
            echo "path=GithubPages" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
